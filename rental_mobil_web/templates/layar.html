{% extends "base.html" %}
{% block title %}Layar Pelanggan{% endblock %}
{% block body %}
<header class="topbar noprint"><strong style="font-family:Sora;color:var(--lilac)">Rental Mobil</strong></header>
<main class="layar" id="panel" aria-live="polite">{{ panel|safe }}</main>
<script>
const POLL_URL = "{{ url_for('layar_poll', t=t) }}";
let lastV = {{ v }};
let t0 = Date.now();
let sedangCek = false;

async function tick() {
  if (sedangCek) return;
  sedangCek = true;
  try {
    const forceIdle = (Date.now() - t0 > 30000) ? "1" : "0";
    const res = await fetch(`${POLL_URL}?v=${lastV}&force=${forceIdle}&_=${Date.now()}`, {
      cache: "no-store"
    });
    if (res.ok) {
      const data = await res.json();
      if (data.changed && data.html) {
        document.getElementById("panel").innerHTML = data.html;
        lastV = data.v;
        t0 = Date.now();
      }
    }
  } catch (e) {
    console.error("Gagal sinkronisasi layar:", e);
  } finally {
    sedangCek = false;
  }
}

setInterval(tick, 1000);
</script>
{% endblock %}
